[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skytrace"
version = "0.6.1"
description = "Evidence-first investigation of repeated SPHEREx observations"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "requests>=2.31",
    "pydantic>=2.5",
    "starlette>=0.37",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
# astropy is the preferred FITS/WCS reader. Without it Skytrace uses its own NumPy
# implementation (src/skytrace/fitsio.py, wcs.py), which tests/live compares with astropy.
astro = ["astropy>=7.0"]
dev = ["pytest>=8", "playwright>=1.44"]

[project.scripts]
skytrace = "skytrace.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: needs network access to IRSA / SIMBAD / Gaia / Meta (run with: pytest -m live)",
    "astropy: needs astropy installed",
    "e2e: browser acceptance test (Playwright + Chromium; run with: pytest -m e2e)",
]
addopts = "-m 'not live and not e2e'"
